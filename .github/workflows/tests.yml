name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: suite + AOT (in devcontainer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build the devcontainer (EigenScript pinned by .devcontainer/Dockerfile's
      # EIGS_REF) and run both suites inside it — the same image a Codespace
      # opens. EIGS=eigenscript uses the on-PATH runtime; the AOT harness also
      # compiles the runtime from source via EIGS_DIR (set in the image) and runs
      # on the runner's native SIMD width (AVX2 -> AOT_VW=4), so AOT correctness
      # is now gated in CI at 4-wide, not just on the SSE2 dev box.
      - name: Build devcontainer and run suites (self-host parity + AOT)
        uses: devcontainers/ci@v0.3
        with:
          # k_oracle --selftest is dispatched here deliberately. CI cannot
          # TAKE the K measurement -- a container has no perf access -- but
          # the plants inject recorded points and execute nothing, so the
          # half that proves the oracle can still go red runs everywhere.
          # An oracle that nothing dispatches is not a gate, and that was
          # the exact residual this repo shipped once already.
          runCmd: bash aot/core_check.sh && bash aot/k_oracle.sh --selftest && EIGS=eigenscript bash test/run.sh && EIGS=eigenscript bash aot/test/run.sh && EIGS=eigenscript bash aot/test/leak.sh
